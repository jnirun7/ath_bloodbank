<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>แดชบอร์ดเจ้าหน้าที่ - ธนาคารเลือด รพ.อ่างทอง</title>
<style>
  :root { --red:#c62828; --red-d:#8e1b1b; --bg:#f7f3f2; --ink:#222; --mute:#6b6b6b; --line:#e3d9d7; --ok:#2e7d32; --warn:#b26a00; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Sarabun", "Noto Sans Thai", sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; }
  header { background:var(--red); color:#fff; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  header b { font-size:17px; } header small { opacity:.85; }
  nav { display:flex; gap:4px; padding:10px 16px 0; overflow-x:auto; border-bottom:1px solid var(--line); background:#fff; }
  nav button { border:0; background:none; padding:10px 14px; font-size:15px; font-family:inherit; cursor:pointer; color:var(--mute); border-bottom:3px solid transparent; white-space:nowrap; }
  nav button.on { color:var(--red); border-color:var(--red); font-weight:700; }
  main { padding:16px; max-width:980px; margin:0 auto; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; overflow-x:auto; }
  h2 { font-size:18px; margin:0 0 10px; } h3 { font-size:15px; margin:14px 0 6px; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--mute); font-weight:600; font-size:13px; }
  input, select, button.btn { font-family:inherit; font-size:14px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  input[type=number] { width:80px; }
  button.btn { background:var(--red); color:#fff; border:0; cursor:pointer; font-weight:600; }
  button.btn.sec { background:#fff; color:var(--red); border:1px solid var(--red); }
  button.btn.sm { padding:5px 10px; font-size:13px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .tag { font-size:12px; padding:2px 8px; border-radius:99px; background:#eee; white-space:nowrap; }
  .tag.ok { background:#e5f4e6; color:var(--ok); } .tag.bad { background:#fde8e8; color:var(--red-d); } .tag.warn { background:#fff1da; color:var(--warn); }
  .mute { color:var(--mute); font-size:13px; }
  .msg { padding:9px 12px; border-radius:8px; margin:8px 0; font-size:14px; background:#e5f4e6; color:var(--ok); }
  .msg.err { background:#fde8e8; color:var(--red-d); }
  .bar { height:10px; background:var(--red); border-radius:5px; min-width:2px; }
  .bar.g { background:var(--ok); }
  .login { max-width:360px; margin:60px auto; }
  .login input { width:100%; margin-bottom:10px; }
  label.ck { display:inline-flex; gap:4px; align-items:center; margin-right:10px; font-size:13px; }
  .slotname { background:#faf0ef; font-weight:700; }
  /* --- มุมมองรายสัปดาห์ --- */
  .wkwrap { overflow-x:auto; }
  table.wk { min-width:760px; table-layout:fixed; }
  table.wk th, table.wk td { border:1px solid var(--line); vertical-align:top; padding:6px 7px; font-size:13px; }
  table.wk th.slt { width:110px; background:#faf6f5; white-space:nowrap; }
  table.wk th a { color:var(--red); text-decoration:none; font-weight:700; }
  table.wk th.today { background:#fdecec; } table.wk td.today { box-shadow:inset 0 0 0 2px var(--red); }
  table.wk .cnt { font-weight:700; margin-bottom:3px; }
  table.wk td.empty { background:#f1f8f2; color:#6b8f6e; } table.wk td.some { background:#fff8e6; } table.wk td.full { background:#fde8e8; }
  table.wk td.hol, table.wk th.hol { background:#fff1da; color:var(--warn); text-align:center; }
  table.wk td.off { background:#f3f0ef; color:#aaa; text-align:center; }
  table.wk tr.tot td { background:#faf6f5; text-align:center; }
  .nm { font-size:12px; line-height:1.35; padding:1px 0; } .nm.completed { color:var(--ok); } .nm.no_show { color:#999; text-decoration:line-through; }
  .lg { display:inline-block; width:12px; height:12px; border:1px solid var(--line); border-radius:3px; margin:0 3px 0 8px; vertical-align:-2px; }
  .lg.full { background:#fde8e8; } .lg.some { background:#fff8e6; } .lg.empty { background:#f1f8f2; } .lg.hol { background:#fff1da; }
  /* --- สถิติ --- */
  .kpis { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px; margin:6px 0 4px; }
  .kpi { border:1px solid var(--line); border-radius:12px; padding:12px; text-align:center; background:#faf6f5; }
  .kpi .kv { font-size:28px; font-weight:700; color:var(--red); line-height:1.1; } .kpi .kl { font-size:13px; color:var(--mute); margin-top:2px; }
  .kpi.ok .kv { color:var(--ok); } .kpi.bad .kv { color:var(--red-d); } .kpi.warn .kv { color:var(--warn); }
  .tblwrap { overflow-x:auto; }
  @media (max-width:560px) { .kpis { grid-template-columns:repeat(2, minmax(0,1fr)); } }
  /* --- สวิตช์ตั้งค่า --- */
  label.sw { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--line); cursor:pointer; }
  label.sw:first-of-type { border-top:0; } label.sw input { margin-top:4px; width:18px; height:18px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=4"></script>
<script src="admin.js?v=4"></script>
</body>
</html>
